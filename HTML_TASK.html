<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Form Example</title>
</head>
<body>

    <h1>HTML Form Example</h1>

    <form action="/submit" method="post">

        <fieldset>
            <legend>User Information</legend>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password">

        </fieldset>

        <br>

        <fieldset>
            <legend>Contact Information</legend>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone"><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="45"></textarea>

        </fieldset>

        <br>

        <fieldset>
            <legend>Subscription</legend>

            <label for="newsletterEmail">Subscribe to newsletter (Email):</label>
            <input type="checkbox" id="newsletterEmail" name="newsletterEmail"><br>

            <label for="newsletterSms">Subscribe to newsletter (SMS):</label>
            <input type="checkbox" id="newsletterSms" name="newsletterSms">

        </fieldset>

        <br>

        <fieldset>
            <legend>Preferred Language</legend>

            <label for="language">Select your preferred language:</label>

            <select id="language" name="language">
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
            </select>

        </fieldset>

        <br>

        <fieldset>
            <legend>Feedback</legend>

            <label for="rating">Rate our service:</label>

            <input type="range" id="rating" name="rating" min="0" max="10">

        </fieldset>

        <br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
